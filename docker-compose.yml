services:
  discovery:
    image: hashicorp/consul:1.22
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    # restart: always

  auth-service:
    image: inter-five/authentification:latest
    build:
      context: .
      dockerfile: authentification/Dockerfile
    ports:
      - "8081:8080"
    # restart: always
    environment:
      - SPRING_CLOUD_CONSUL_HOST=discovery
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      discovery:
        condition: service_started
