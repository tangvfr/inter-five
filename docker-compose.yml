services:
  rabbit:
    image: rabbitmq:4.2.2-management-alpine
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq


  discovery:
    image: hashicorp/consul:1.22
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    # restart: always

  auth-service:
    image: inter-five/authentification:latest
    build:
      context: .
      dockerfile: authentification/Dockerfile
    ports:
      - "8080:8080"
    # restart: always
    environment:
      - SPRING_CLOUD_CONSUL_HOST=discovery
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      discovery:
        condition: service_started



configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local